services:
  database:
    build:
      context: ../..
      dockerfile: install/dev/postgres/Dockerfile
    environment:
      - "POSTGRES_DB=wikijump"
      - "POSTGRES_USER=wikijump"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_HOST_AUTH_METHOD=md5"
      - "POSTGRES_INITDB_ARGS=--locale en_US.UTF-8"
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 10s
      timeout: 5s
      retries: 6

  cache:
    build: valkey
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      - "VALKEY_PASSWORD=${VALKEY_PASSWORD:?set VALKEY_PASSWORD for the dev cache}"
      - "VALKEYCLI_AUTH=${VALKEY_PASSWORD:?set VALKEY_PASSWORD for the dev cache}"
    command:
      - "sh"
      - "-c"
      - 'case "$$VALKEY_PASSWORD" in *[!A-Za-z0-9._~-]*) echo "VALKEY_PASSWORD must use URL-safe characters" >&2; exit 64;; esac; [ "$${#VALKEY_PASSWORD}" -ge 16 ] || { echo "VALKEY_PASSWORD must be at least 16 characters" >&2; exit 64; }; cp /usr/local/etc/valkey.conf /tmp/valkey.conf && printf "\nrequirepass %s\n" "$$VALKEY_PASSWORD" >> /tmp/valkey.conf && unset VALKEY_PASSWORD VALKEYCLI_AUTH && exec valkey-server /tmp/valkey.conf'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  deepwell:
    image: 575596218155.dkr.ecr.us-east-2.amazonaws.com/wikijump/deepwell:dev
    expose:
      - "2747"
    environment:
      - "DATABASE_URL=postgres://wikijump:${POSTGRES_PASSWORD}@database/wikijump"
      - "REDIS_URL=redis://:${VALKEY_PASSWORD}@cache"
      - "S3_FILES_BUCKET=${S3_FILES_BUCKET}"
      - "S3_TEXT_BLOCKS_BUCKET=${S3_TEXT_BLOCKS_BUCKET}"
      - "S3_REGION_NAME=${S3_REGION_NAME}"
      - "S3_CUSTOM_ENDPOINT=${S3_CUSTOM_ENDPOINT}"
      - "S3_PATH_STYLE=${S3_PATH_STYLE}"
      - "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}"
      - "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 2s
      retries: 3
      start_period: 600s
      start_interval: 10s

  framerail:
    image: 575596218155.dkr.ecr.us-east-2.amazonaws.com/wikijump/framerail:dev
    expose:
      - "3393"
    environment:
      - "DEEPWELL_HOST=deepwell"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 2s
      retries: 3

  wws:
    image: 575596218155.dkr.ecr.us-east-2.amazonaws.com/wikijump/wws:dev
    expose:
      - "3466"
    environment:
      - "ADDRESS=[::]:3466"
      - "DEEPWELL_URL=http://deepwell:2747"
      - "REDIS_URL=redis://:${VALKEY_PASSWORD}@cache"
      - "S3_FILES_BUCKET=${S3_FILES_BUCKET}"
      - "S3_TEXT_BLOCKS_BUCKET=${S3_TEXT_BLOCKS_BUCKET}"
      - "S3_REGION_NAME=${S3_REGION_NAME}"
      - "S3_CUSTOM_ENDPOINT=${S3_CUSTOM_ENDPOINT}"
      - "S3_PATH_STYLE=${S3_PATH_STYLE}"
      - "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}"
      - "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 120s
      timeout: 2s
      retries: 3

  caddy:
    image: 575596218155.dkr.ecr.us-east-2.amazonaws.com/wikijump/caddy:dev
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - "DIGITALOCEAN_API_TOKEN=${DIGITALOCEAN_API_TOKEN}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wikijump-health-check"]
      interval: 30s
      timeout: 2s
      retries: 3
    volumes:
      - caddy:/data/caddy
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  caddy:
