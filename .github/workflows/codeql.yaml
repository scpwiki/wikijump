name: CodeQL

on:
  push:
    branches:
      - develop
      - prod
  pull_request:
    branches:
      - develop
  schedule:
    - cron: '34 3 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Rust source for CodeQL
        run: |
          rustup component add rust-src
          rust_sysroot="$(rustc --print sysroot)"
          rust_src="${rust_sysroot}/lib/rustlib/src/rust/library"
          test -d "$rust_src"
          {
            echo "RUST_SRC_PATH=$rust_src"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT=$rust_sysroot"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_SYSROOT_SRC=$rust_src"
            echo "CODEQL_EXTRACTOR_RUST_OPTION_EXTRACT_DEPENDENCIES_AS_SOURCE=true"
          } >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
