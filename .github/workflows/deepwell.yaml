name: '[deepwell] Rust'

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - 'deepwell/**'
      - '.github/workflows/deepwell.yaml'
      - '.github/codecov.yml'
      - 'install/local/deepwell/config.toml'
      - 'install/dev/deepwell/config.toml'
      - 'install/prod/deepwell/config.toml'
  push:
    branches:
      - develop
      - prod
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}

jobs:
  test_and_coverage:
    name: Build, Test and Coverage
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      RUSTFLAGS: -D warnings
      DATABASE_URL: postgres://postgres:postgres@postgres/postgres
      REDIS_URL: redis://valkey
      S3_FILES_BUCKET: deepwell-files
      S3_TEXT_BLOCKS_BUCKET: deepwell-text-blocks
      S3_REGION_NAME: test
      S3_PATH_STYLE: 'true'
      S3_CUSTOM_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio-github-test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            deepwell/target
          key: ${{ runner.os }}-deepwell-default-${{ hashFiles('deepwell/**/Cargo.toml') }}

      - name: System Dependencies
        run: apt update && apt install libmagic-dev

      - name: Start MinIO
        run: |
          curl -fsSLo /usr/local/bin/minio https://dl.min.io/server/minio/release/linux-amd64/archive/minio.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f /usr/local/bin/minio" | sha256sum -c -

          curl -fsSLo /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/archive/mc.RELEASE.2025-08-13T08-35-41Z
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891 /usr/local/bin/mc" | sha256sum -c -

          chmod +x /usr/local/bin/minio /usr/local/bin/mc

          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER="${S3_ACCESS_KEY_ID}" \
            MINIO_ROOT_PASSWORD="${S3_SECRET_ACCESS_KEY}" \
            MINIO_REGION_NAME="${S3_REGION_NAME}" \
            minio server /tmp/minio-data --address :9000 --console-address :9001 > /tmp/minio.log 2>&1 &

          ready=false
          for _ in $(seq 1 30); do
            if mc alias set local "${S3_CUSTOM_ENDPOINT}" "${S3_ACCESS_KEY_ID}" "${S3_SECRET_ACCESS_KEY}" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "${ready}" != true ]; then
            cat /tmp/minio.log
            exit 1
          fi

          mc mb -p "local/${S3_FILES_BUCKET}" "local/${S3_TEXT_BLOCKS_BUCKET}"

      - name: Install Tools
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Build (no features)
        run: cd deepwell && cargo build --locked --no-default-features

      - name: Build (all features)
        run: cd deepwell && cargo build --locked --all-features

      - name: Check Configuration
        run: cd deepwell && cargo run --locked --all-features -- config.example.toml ../install/local/deepwell/config.toml ../install/dev/deepwell/config.toml ../install/prod/deepwell/config.toml
        env:
          DEEPWELL_RUNTIME_ACTION: validate-config

      - name: Run Migrations
        run: cd deepwell && sqlx migrate run

      - name: Run Seeder
        run: cd deepwell && cargo run --locked --all-features -- config.example.toml
        env:
          DEEPWELL_RUNTIME_ACTION: run-seeder

      - name: Test
        run: cd deepwell && cargo test --locked --all-features -- --nocapture --test-threads 1

      - name: Generate Coverage
        run: |
          cd deepwell && cargo +nightly tarpaulin --locked --all-features --workspace --timeout 120 --out xml --output-dir target/coverage -- --test-threads 1

      - name: Export Coverage
        # codecov/codecov-action v5.5.5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
        with:
          use_oidc: true
          slug: Rokurolize/wikijump
          files: deepwell/target/coverage/cobertura.xml
          flags: deepwell
          disable_search: true
          fail_ci_if_error: true

  clippy_lint:
    name: Lint
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cargo Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            deepwell/target
          key: ${{ runner.os }}-deepwell-lint-${{ hashFiles('deepwell/**/Cargo.toml') }}

      - name: System Dependencies
        run: sudo apt update && sudo apt install libmagic-dev

      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.1 --locked

      - name: Machete
        run: cargo machete deepwell

      - name: Rustfmt
        run: cd deepwell && cargo fmt --all -- --check

      - name: Clippy
        run: cd deepwell && cargo clippy --locked --tests --no-deps
