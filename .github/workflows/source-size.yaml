name: Source size budget

on:
  pull_request:
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_size:
    name: Source size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check source-size budget
        env:
          SOURCE_SIZE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-source-size.sh
