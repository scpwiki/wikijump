name: '[backend] Docker build Framerail (prod)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/prod/framerail/Dockerfile'
      - '.github/workflows/docker-build-framerail.prod.yaml'
      - '.github/workflows/docker-build-template.yaml'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/framerail
      image-name: framerail
      tier: prod
    secrets:
      aws-access-key: unused-for-build-only-workflow
      aws-secret-key: unused-for-build-only-workflow
