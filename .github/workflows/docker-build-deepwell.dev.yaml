name: '[backend] Docker build DEEPWELL (dev)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/dev/deepwell/Dockerfile'
      - '.github/workflows/docker-build-deepwell.dev.yaml'
      - '.github/workflows/docker-build-template.yaml'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/deepwell
      image-name: deepwell
      tier: dev
    secrets:
      aws-access-key: unused-for-build-only-workflow
      aws-secret-key: unused-for-build-only-workflow
