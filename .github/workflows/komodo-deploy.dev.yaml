name: '[komodo] Deploy Dev'

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  # Wait for image push jobs to complete
  # See https://stackoverflow.com/a/75597437
  caddy:
    if: ${{ github.repository == 'scpwiki/wikijump' }}
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/caddy
      image-name: caddy
      tier: dev
      push: true
    secrets:
      aws-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY }}
      aws-secret-key: ${{ secrets.AWS_ECR_SECRET_KEY }}

  deepwell:
    if: ${{ github.repository == 'scpwiki/wikijump' }}
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/deepwell
      image-name: deepwell
      tier: dev
      push: true
    secrets:
      aws-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY }}
      aws-secret-key: ${{ secrets.AWS_ECR_SECRET_KEY }}

  framerail:
    if: ${{ github.repository == 'scpwiki/wikijump' }}
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/framerail
      image-name: framerail
      tier: dev
      push: true
    secrets:
      aws-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY }}
      aws-secret-key: ${{ secrets.AWS_ECR_SECRET_KEY }}

  wws:
    if: ${{ github.repository == 'scpwiki/wikijump' }}
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/wws
      image-name: wws
      tier: dev
      push: true
    secrets:
      aws-access-key: ${{ secrets.AWS_ECR_ACCESS_KEY }}
      aws-secret-key: ${{ secrets.AWS_ECR_SECRET_KEY }}

  # Then send webhook notification for Komodo to deploy.
  #
  # This ensures that all images are built and pushed up before
  # attempting to redeploy the stack.
  notify_komodo:
    if: ${{ github.repository == 'scpwiki/wikijump' }}
    name: Deploy Komodo (dev)
    runs-on: ubuntu-latest
    needs: [caddy, deepwell, framerail, wws]
    steps:
      - name: Invoke deployment hook
        env:
          WEBHOOK_URL: ${{ secrets.KOMODO_DEPLOY_DEV_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.KOMODO_DEPLOY_DEV_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          payload=$(node <<'NODE'
          const crypto = require('node:crypto');

          process.stdout.write(JSON.stringify({
            event: process.env.GITHUB_EVENT_NAME,
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            head: process.env.GITHUB_HEAD_REF || '',
            workflow: process.env.GITHUB_WORKFLOW,
            requestID: crypto.randomUUID(),
          }));
          NODE
          )
          signature=$(PAYLOAD="$payload" node <<'NODE'
          const crypto = require('node:crypto');

          process.stdout.write(
            `sha1=${crypto
              .createHmac('sha1', process.env.WEBHOOK_SECRET)
              .update(process.env.PAYLOAD)
              .digest('hex')}`,
          );
          NODE
          )
          signature_256=$(PAYLOAD="$payload" node <<'NODE'
          const crypto = require('node:crypto');

          process.stdout.write(
            `sha256=${crypto
              .createHmac('sha256', process.env.WEBHOOK_SECRET)
              .update(process.env.PAYLOAD)
              .digest('hex')}`,
          );
          NODE
          )

          curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            --header "X-Hub-Signature: $signature" \
            --header "X-Hub-Signature-256: $signature_256" \
            --data "$payload" \
            "$WEBHOOK_URL"
