name: '[backend] Docker build Caddy (dev)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/dev/caddy/*'
      - '.github/workflows/docker-build-caddy.dev.yaml'
      - '.github/workflows/docker-build-template.yaml'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docker-build-template.yaml
    with:
      image-repository: wikijump/caddy
      image-name: caddy
      tier: dev
